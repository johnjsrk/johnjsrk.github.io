<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 650px; margin: 30px auto; padding: 0 20px; color: #333; line-height: 1.6; }
        h2 { border-bottom: 2px solid #2ea44f; padding-bottom: 10px; }
        .form-box { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e1e4e8; margin-bottom: 30px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { background: #2ea44f; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px; }
        button:hover { background: #2c974b; }
        .post { border: 1px solid #e1e4e8; border-radius: 6px; padding: 15px; margin-bottom: 15px; position: relative; background: #fff; }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; color: #666; }
        .post-title { font-weight: bold; font-size: 1.1em; color: #24292e; margin-bottom: 8px; }
        .post-content { white-space: pre-wrap; color: #444; }
        .delete-btn { background: #cf222e; padding: 4px 8px; font-size: 0.8em; margin-left: 10px; }
        .delete-btn:hover { background: #a40e26; }
    </style>
</head>
<body>

    <h2>게시판</h2>

    <!-- 글 작성 폼 -->
    <div class="form-box">
        <div class="input-row">
            <input type="text" id="nickname" placeholder="닉네임" style="width: 50%;">
            <input type="password" id="password" placeholder="비밀번호(삭제용)" style="width: 50%;">
        </div>
        <input type="text" id="title" placeholder="제목을 입력하세요" style="margin-bottom: 10px;">
        <textarea id="content" rows="4" placeholder="내용을 입력하세요"></textarea>
        <button onclick="addPost()">글 등록하기</button>
    </div>

    <!-- 게시글 목록 -->
    <div id="post-list">데이터를 불러오는 중...</div>

    <!-- Firebase SDK (v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ 본인의 Firebase 프로젝트 설정값으로 변경하세요
        const firebaseConfig = {
            apiKey: "AIzaSyCTDIB4bPkM55SxHt62DRdQ9YcS2flrlT0",
            authDomain: "myboard-e1c6a.firebaseapp.com",
            projectId: "myboard-e1c6a",
            storageBucket: "myboard-e1c6a.appspot.com",
            messagingSenderId: "190619665164",
            appId: "1:190619665164:web:aa9c2bffedc95196423f29"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 글 작성 함수
        window.addPost = async function() {
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value.trim();
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            if (!nickname || !password || !title || !content) {
                alert('모든 항목을 입력해 주세요.');
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    nickname: nickname,
                    password: password,
                    title: title,
                    content: content,
                    createdAt: serverTimestamp()
                });

                document.getElementById('nickname').value = '';
                document.getElementById('password').value = '';
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                
                loadPosts(); // 목록 새로고침
            } catch (e) {
                console.error("에러 발생: ", e);
                alert("글 작성 실패!");
            }
        };

        // 글 삭제 함수
        window.deletePost = async function(id, correctPassword) {
            const inputPassword = prompt("삭제하려면 작성 시 입력했던 비밀번호를 입력하세요:");
            if (!inputPassword) return;

            if (inputPassword === correctPassword) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    alert("게시글이 삭제되었습니다.");
                    loadPosts();
                } catch (e) {
                    alert("삭제 실패!");
                }
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        };

        // 글 목록 불러오기 함수
        async function loadPosts() {
            const listContainer = document.getElementById('post-list');
            try {
                const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                listContainer.innerHTML = '';

                if (querySnapshot.empty) {
                    listContainer.innerHTML = '<p style="color:#888;">등록된 게시물이 없습니다.</p>';
                    return;
                }

                querySnapshot.forEach((docSnapshot) => {
                    const post = docSnapshot.data();
                    const postId = docSnapshot.id;
                    
                    const dateStr = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleString('ko-KR') : '방금 전';

                    const item = document.createElement('div');
                    item.className = 'post';
                    item.innerHTML = `
                        <div class="post-header">
                            <span><b>${escapeHtml(post.nickname)}</b></span>
                            <span>${dateStr} <button class="delete-btn" onclick="deletePost('${postId}', '${post.password}')">삭제</button></span>
                        </div>
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (e) {
                console.error("불러오기 에러: ", e);
                listContainer.innerHTML = '<p>게시글을 불러오는 중 오류가 발생했습니다. (Firebase 설정을 확인하세요)</p>';
            }
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        // 페이지 로드 시 목록 불러오기
        loadPosts();
    </script>
</body>
</html>
