<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 공용 위키 메모장</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; }
        h1 { color: #333; text-align: center; }
        textarea { width: 100%; height: 300px; padding: 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; resize: vertical; display: block; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; font-size: 16px; background-color: #2da44e; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2c974b; }
        .status { text-align: right; color: #66px; font-size: 14px; margin-top: -5px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>📝 공용 위키 메모장</h1>
    <p style="text-align: center; color: #666;">누구나 내용을 수정하고 저장할 수 있는 공간입니다.</p>
    
    <div id="status" class="status">불러오는 중...</div>
    <textarea id="memo" placeholder="여기에 내용을 작성하세요..."></textarea>
    <button onclick="saveMemo()">💾 변경사항 저장하기</button>

    <script>
        // 고유한 데이터 저장소 ID (본인만의 공간을 쓰려면 아래 주소의 ID를 변경해도 됩니다)
        const blobUrl = "https://jsonblob.com/api/jsonBlob/019fdc31-5060-7f34-b979-81727b3be093";
        const memoEl = document.getElementById('memo');
        const statusEl = document.getElementById('status');

        // 1. 메모 불러오기 함수
        function loadMemo() {
            fetch(blobUrl)
                .then(response => response.json())
                .then(data => {
                    memoEl.value = data.content || "";
                    statusEl.innerText = "최신 상태입니다.";
                })
                .catch(error => {
                    statusEl.innerText = "데이터를 불러오지 못했습니다.";
                    console.error(error);
                });
        }

        // 2. 메모 저장하기 함수
        function saveMemo() {
            statusEl.innerText = "저장 중...";
            
            fetch(blobUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: memoEl.value })
            })
            .then(response => {
                if(response.ok) {
                    statusEl.innerText = "성공적으로 저장되었습니다!";
                } else {
                    statusEl.innerText = "저장 실패 (서버 오류)";
                }
            })
            .catch(error => {
                statusEl.innerText = "네트워크 오류로 저장 실패";
                console.error(error);
            });
        }

        // 페이지가 열리면 자동으로 메모를 로드합니다.
        window.onload = loadMemo;
    </script>
</body>
</html>
