<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 공용 위키 게시판</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 50px auto; padding: 0 20px; background: #fff; color: #333; line-height: 1.7; }
        h1 { text-align: center; color: #111; margin-bottom: 5px; font-size: 28px; cursor: pointer; }
        .sub-text { text-align: center; color: #666; margin-top: 0; margin-bottom: 40px; font-size: 14px; }
        .info-bar { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .view-section { display: none; }
        .active { display: block; }
        .post-item { padding: 15px 0; border-bottom: 1px solid #f1f3f5; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .post-item:hover { background: #fafafa; }
        .post-title { font-size: 17px; font-weight: bold; color: #222; }
        .post-date { font-size: 13px; color: #888; }
        .detail-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #111; }
        .detail-content { min-height: 200px; white-space: pre-wrap; font-size: 16px; margin: 20px 0; color: #333; }
        input[type="text"], input[type="password"], textarea { width: 100%; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 16px; padding: 12px; margin-bottom: 15px; }
        textarea { height: 250px; resize: vertical; }
        .form-row { display: flex; gap: 10px; }
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn { padding: 12px 20px; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-block { width: 100%; }
        .btn-primary { background-color: #0969da; color: white; }
        .btn-primary:hover { background-color: #0550ae; }
        .btn-success { background-color: #2da44e; color: white; }
        .btn-success:hover { background-color: #2c974b; }
        .btn-danger { background-color: #cf222e; color: white; }
        .btn-danger:hover { background-color: #a41721; }
        .btn-secondary { background-color: #f1f3f5; color: #495057; }
        .btn-secondary:hover { background-color: #e9ecef; }
    </style>
</head>
<body>

    <h1 onclick="showListView()">📝 공용 위키 게시판</h1>
    <p class="sub-text">비밀번호를 설정하여 본인의 글을 보호할 수 있습니다.</p>
    
    <div class="info-bar">
        <span id="status">데이터를 불러오는 중...</span>
        <span id="count-display">글 0개</span>
    </div>

    <!-- 1. 목록 화면 -->
    <div id="list-view" class="view-section active">
        <div id="posts-list">등록된 글이 없습니다.</div>
        <button class="btn btn-primary btn-block" style="margin-top: 20px;" onclick="showFormView(false)">✏️ 새 글 작성하기</button>
    </div>

    <!-- 2. 상세 화면 -->
    <div id="detail-view" class="view-section">
        <div id="detail-title" class="detail-title">제목</div>
        <div id="detail-date" style="font-size:13px; color:#888;">날짜</div>
        <div id="detail-content" class="detail-content">내용</div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="handleEditRequest()">수정</button>
            <button class="btn btn-danger" onclick="handleDeleteRequest()">삭제</button>
            <button class="btn btn-secondary" onclick="showListView()">목록으로</button>
        </div>
    </div>

    <!-- 3. 입력 양식 화면 -->
    <div id="form-view" class="view-section">
        <h2 id="form-title" style="margin-top:0;">새 글 작성</h2>
        <div class="form-row">
            <input type="text" id="post-title-input" placeholder="제목을 입력하세요" style="flex: 2;">
            <input type="password" id="post-pw-input" placeholder="비밀번호(4자리 이상)" style="flex: 1;">
        </div>
        <textarea id="post-content-input" placeholder="내용을 작성하세요..."></textarea>
        <div class="btn-group">
            <button class="btn btn-success" onclick="savePost()">저장하기</button>
            <button class="btn btn-secondary" onclick="cancelForm()">취소</button>
        </div>
    </div>

    <script>
        // ⚠️ 본인의 고유 주소로 채워주세요
        const blobUrl = "https://jsonblob.com/api/jsonBlob/019fdc31-5060-7f34-b979-81727b3be093";
        
        let db = { posts: [] }, currentPostId = null, isEditMode = false;  

        function navigateTo(id) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showListView() { navigateTo('list-view'); renderList(); }

        function renderList() {
            const listEl = document.getElementById('posts-list');
            document.getElementById('count-display').innerText = `글 ${db.posts.length}개`;
            if (db.posts.length === 0) {
                listEl.innerHTML = "<p style='color:#888; text-align:center;'>등록된 글이 없습니다.</p>";
                return;
            }
            const sorted = [...db.posts].reverse();
            listEl.innerHTML = sorted.map(p => `
                <div class="post-item" onclick="showDetailView(${p.id})">
                    <div class="post-title">${escapeHtml(p.title)}</div>
                    <div class="post-date">${p.updatedAt.substring(0, 10)}</div>
                </div>
            `).join('');
        }

        function showDetailView(id) {
            currentPostId = id;
            const p = db.posts.find(x => x.id === id);
            if (!p) return;
            document.getElementById('detail-title').innerText = p.title;
            document.getElementById('detail-date').innerText = `최종 수정: ${p.updatedAt}`;
            document.getElementById('detail-content').innerText = p.content;
            navigateTo('detail-view');
        }

        function showFormView(edit = false) {
            isEditMode = edit;
            const pwIn = document.getElementById('post-pw-input');
            if (edit) {
                document.getElementById('form-title').innerText = "글 수정하기";
                const p = db.posts.find(x => x.id === currentPostId);
                document.getElementById('post-title-input').value = p.title;
                document.getElementById('post-content-input').value = p.content;
                pwIn.style.display = 'none'; 
            } else {
                document.getElementById('form-title').innerText = "새 글 작성하기";
                document.getElementById('post-title-input').value = "";
                document.getElementById('post-content-input').value = "";
                pwIn.value = ""; pwIn.style.display = 'block'; 
            }
            navigateTo('form-view');
        }

        function cancelForm() { if (isEditMode) showDetailView(currentPostId); else showListView(); }

        function handleEditRequest() {
            const p = db.posts.find(x => x.id === currentPostId);
            if (!p) return;
            const inputPw = prompt("수정 비밀번호를 입력하세요:");
            if (inputPw === null) return;
            if (inputPw === p.password) showFormView(true);
            else alert("비밀번호가 일치하지 않습니다.");
        }

        function handleDeleteRequest() {
            const p = db.posts.find(x => x.id === currentPostId);
            if (!p) return;
            const inputPw = prompt("삭제 비밀번호를 입력하세요:");
            if (inputPw === null) return;
            if (inputPw === p.password) {
                if (confirm("정말 삭제하시겠습니까?")) {
                    db.posts = db.posts.filter(x => x.id !== currentPostId);
                    updateServer(true);
                }
            } else alert("비밀번호가 일치하지 않습니다.");
        }

        function loadBoard() {
            fetch(blobUrl).then(res => res.json()).then(data => {
                db = data.posts ? data : { posts: [] };
                document.getElementById('status').innerText = "조회 완료";
                showListView();
            }).catch(() => { document.getElementById('status').innerText = "로드 실패"; });
        }

        function savePost() {
            const t = document.getElementById('post-title-input').value.trim();
            const c = document.getElementById('post-content-input').value;
            const pw = document.getElementById('post-pw-input').value.trim();
            if (!t) { alert("제목을 입력해 주세요."); return; }
            if (!isEditMode && (!pw || pw.length < 4)) { alert("비밀번호를 4자리 이상 입력해 주세요."); return; }
            const now = new Date();
            const ts = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0') + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            if (isEditMode) {
                const p = db.posts.find(x => x.id === currentPostId);
                if (p) { p.title = t; p.content = c; p.updatedAt = ts; }
            } else {
                const newId = db.posts.length > 0 ? Math.max(...db.posts.map(p => p.id)) + 1 : 1;
                db.posts.push({ id: newId, title: t, content: c, password: pw, updatedAt: ts });
                currentPostId = newId;
            }
            updateServer();
        }

        // [수정 완료된 서버 저장 함수]
        function updateServer(isDel = false) {
            document.getElementById('status').innerText = "저장 중...";
            fetch(blobUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(db)
            }).then(res => {
                if (res.ok) {
                    document.getElementById('status').innerText = "저장 성공";
                    if (isDel) showListView(); else showDetailView(currentPostId);
                } else alert("서버 저장 실패");
            }).catch(err => console.error(err));
        }

        // [🛠️ 버그 수정 완료된 보안 함수]
        function escapeHtml(text) { 
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;"); 
        }

        // 페이지 로드 시 게시판 데이터 불러오기 실행
        window.onload = loadBoard;
    </script>
</body>
</html>
