<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 공용 위키 메모장</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f9f9f9; color: #333; line-height: 1.6; }
        h1 { text-align: center; color: #111; margin-bottom: 5px; }
        .sub-text { text-align: center; color: #666; margin-top: 0; margin-bottom: 25px; font-size: 14px; }
        
        /* 카드 스타일 컨테이너 */
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e6; }
        
        /* 상태 표시 및 시간 영역 */
        .info-bar { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px id #eee; }
        .time-text { font-weight: bold; color: #0969da; }

        /* [보기 모드] 일반 텍스트 화면 */
        #view-mode { min-height: 200px; white-space: pre-wrap; word-break: break-all; font-size: 16px; padding: 10px 0; }

        /* [수정 모드] 텍스트 입력창 (처음엔 숨김) */
        #edit-mode { display: none; }
        textarea { width: 100%; height: 300px; padding: 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; resize: vertical; display: block; margin-bottom: 15px; font-family: inherit; }
        
        /* 버튼 공통 스타일 */
        .btn { width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-edit { background-color: #0969da; color: white; }
        .btn-edit:hover { background-color: #0550ae; }
        .btn-save { background-color: #2da44e; color: white; margin-bottom: 8px; }
        .btn-save:hover { background-color: #2c974b; }
        .btn-cancel { background-color: #bae1ff; color: #004487; }
        .btn-cancel:hover { background-color: #a3d3fa; }
    </style>
</head>
<body>

    <h1>📝 공용 위키 메모장</h1>
    <p class="sub-text">누구나 내용을 읽고 자유롭게 수정할 수 있는 공간입니다.</p>
    
    <div class="container">
        <!-- 상단 정보 바 (상태 및 수정 시간) -->
        <div class="info-bar">
            <span id="status">데이터를 불러오는 중...</span>
            <span>최종 수정: <span id="time-display" class="time-text">-</span></span>
        </div>

        <!-- 1. 보기 모드 화면 -->
        <div id="view-mode">데이터를 로드하고 있습니다...</div>

        <!-- 2. 수정 모드 화면 (기본적으로 숨겨짐) -->
        <div id="edit-mode">
            <textarea id="memo-input" placeholder="여기에 내용을 작성하세요..."></textarea>
            <button class="btn btn-save" onclick="saveMemo()">💾 변경사항 저장하기</button>
            <button class="btn btn-cancel" onclick="switchMode(false)">취소</button>
        </div>

        <!-- 보기 모드 전용 버튼 -->
        <button id="btn-to-edit" class="btn btn-edit" onclick="switchMode(true)" style="display: none;">✏️ 내용 수정하기</button>
    </div>

    <script>
        // ⚠️ 본인의 jsonblob 주소로 꼭 교체해 주세요!
        const blobUrl = "https://jsonblob.com/api/jsonBlob/019fdc31-5060-7f34-b979-81727b3be093";
        
        const viewModeEl = document.getElementById('view-mode');
        const editModeEl = document.getElementById('edit-mode');
        const memoInputEl = document.getElementById('memo-input');
        const btnToEditEl = document.getElementById('btn-to-edit');
        const statusEl = document.getElementById('status');
        const timeDisplayEl = document.getElementById('time-display');

        // 보기 모드 <-> 수정 모드 전환 함수 (줄바꿈 버그 수정 버전)
        function switchMode(isEdit) {
            if (isEdit) {
                viewModeEl.style.display = 'none';
                btnToEditEl.style.display = 'none';
                editModeEl.style.display = 'block';
                
                // 🛠️ [버그 수정] innerText 대신 textContent를 사용하거나 
                // 빈 화면일 때 처리하여 엔터(줄바꿈)가 사라지지 않게 보호합니다.
                if (viewModeEl.textContent === "작성된 내용이 없습니다.") {
                    memoInputEl.value = "";
                } else {
                    memoInputEl.value = viewModeEl.textContent;
                }
                
                memoInputEl.focus();
            } else {
                viewModeEl.style.display = 'block';
                btnToEditEl.style.display = 'block';
                editModeEl.style.display = 'none';
            }
        }


        // 데이터 불러오기 (GET)
        function loadMemo() {
            fetch(blobUrl)
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.json();
                })
                .then(data => {
                    // 내용 출력 (비어있으면 안내 문구)
                    viewModeEl.innerText = data.content || "작성된 내용이 없습니다.";
                    // 날짜 출력 (없으면 기록 없음 표시)
                    timeDisplayEl.innerText = data.updatedAt || "기록 없음";
                    statusEl.innerText = "조회 완료";
                    btnToEditEl.style.display = 'block'; // 로드가 끝나면 수정 버튼 노출
                })
                .catch(error => {
                    statusEl.innerText = "불러오기 실패";
                    viewModeEl.innerText = "데이터를 로드하지 못했습니다. 주소나 네트워크를 확인하세요.";
                });
        }

        // 데이터 저장하기 (PUT)
        function saveMemo() {
            statusEl.innerText = "저장 중...";
            
            // 현재 날짜와 시간 생성 (예: 2026-08-07 22:05:14)
            const now = new Date();
            const timestamp = now.getFullYear() + '-' + 
                String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                String(now.getDate()).padStart(2, '0') + ' ' + 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0') + ':' + 
                String(now.getSeconds()).padStart(2, '0');

            const payload = {
                content: memoInputEl.value,
                updatedAt: timestamp
            };

            fetch(blobUrl, {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if(response.ok) {
                    statusEl.innerText = "저장 성공!";
                    // 화면 데이터 갱신 후 보기 모드로 전환
                    viewModeEl.innerText = payload.content || "작성된 내용이 없습니다.";
                    timeDisplayEl.innerText = payload.updatedAt;
                    switchMode(false);
                } else {
                    statusEl.innerText = "저장 실패";
                }
            })
            .catch(error => {
                statusEl.innerText = "네트워크 오류";
                console.error(error);
            });
        }

        // 페이지가 열리면 서버에서 데이터를 읽어옵니다.
        window.onload = loadMemo;
    </script>
</body>
</html>
